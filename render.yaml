services:
  - type: web
    name: anifire-api
    runtime: docker
    rootDir: anime-backend/anime-backend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: DB_HOST
        fromDatabase:
          name: anifire-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: anifire-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: anifire-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: anifire-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: anifire-db
          property: password
      - key: ANIFIRE_CORS_ALLOWED_ORIGINS
        value: https://anifire-web.onrender.com
      - key: ANIFIRE_APP_FRONTEND_URL
        value: https://anifire-web.onrender.com
      - key: ANIFIRE_SECURITY_PEPPER
        generateValue: true
      - key: ANIFIRE_JWT_ISSUER
        value: https://anifire-api.onrender.com
      - key: ANIFIRE_JWT_AUDIENCE
        value: anifire-web
      - key: ANIFIRE_SECURITY_COOKIE_SECURE
        value: true

  - type: web
    name: anifire-web
    runtime: node
    rootDir: anime-streaming
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_BACKEND_URL
        value: https://anifire-api.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://anifire-api.onrender.com/api/v1/animes
      - key: NODE_ENV
        value: production

databases:
  - name: anifire-db
    databaseName: anifire_database
    user: anifire
    plan: free
