
spring.application.name=anime-backend
server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:anifire_database}
spring.datasource.username=${DB_USERNAME:myuser}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
anifire.seed.enabled=true

# ════════════════════════ Auth / Security ════════════════════════
# CORS: comma-separated origins allowed to call the API with credentials.
anifire.cors.allowed-origins=${ANIFIRE_CORS_ALLOWED_ORIGINS:http://localhost:3000}
# Base URL of the frontend (used to build email links).
anifire.app.frontend-url=${ANIFIRE_APP_FRONTEND_URL:http://localhost:3000}

# JWT (RS256). Keys are auto-generated to ./auth-keys/jwks.json on first run
# if anifire.jwt.jwk-set is not provided. Provide a real key in production.
anifire.jwt.issuer=${ANIFIRE_JWT_ISSUER:https://auth.anifire.local}
anifire.jwt.audience=${ANIFIRE_JWT_AUDIENCE:anifire-web}
anifire.jwt.access-ttl=PT15M
anifire.jwt.refresh-ttl=P30D
anifire.jwt.jwk-set=${ANIFIRE_JWT_JWK_SET:}

# Password / login hardening.
# DEV pepper only — MUST be overridden via env (ANIFIRE_SECURITY_PEPPER) in prod.
anifire.security.pepper=${ANIFIRE_SECURITY_PEPPER:ZGV2LW9ubHktcGVwcGVyLWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9u}
anifire.security.cookie-secure=${ANIFIRE_SECURITY_COOKIE_SECURE:false}
anifire.security.max-failed-attempts=5
anifire.security.lock-duration=PT15M
# Toggle the Have-I-Been-Pwned breach check (k-anonymity range API).
anifire.security.breach-check-enabled=${ANIFIRE_BREACH_CHECK_ENABLED:true}
# When false, registration issues a verification token and the link is printed
# in the backend terminal (EmailService logs it); login requires verification.
anifire.security.auto-verify-email=${ANIFIRE_AUTO_VERIFY_EMAIL:false}
