services:
  postgres:
    # Pinned: 'latest' moved to Postgres 18, which changed the data-dir layout and
    # is incompatible with a volume mounted at /var/lib/postgresql/data. 16 is
    # stable and uses the classic layout the named volume below expects.
    image: 'postgres:16'
    environment:
      - 'POSTGRES_DB=anifire_database'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
      - 'TZ=UTC'
    ports:
      - '5433:5432'
    # Named volume so accounts/data survive container restarts & recreation.
    # Without this, stopping the backend (which tears the container down) wiped
    # the database and all registered users.
    volumes:
      - 'anifire_pgdata:/var/lib/postgresql/data'

volumes:
  anifire_pgdata:
